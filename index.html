<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>house.luannguyen.work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #faf5ff 50%, #fff7ed 100%);
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --radius: 20px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f8fafc;
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 64px 20px;
}
.wrap { width: 100%; max-width: 760px; }
header { text-align: center; margin-bottom: 40px; }
header h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  background: linear-gradient(135deg, #0f766e, #064e3b);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
header p { color: var(--muted); margin: 0; font-size: 15px; }
.cards { display: grid; gap: 16px; }
a.card {
  display: flex;
  align-items: center;
  gap: 18px;
  text-decoration: none;
  color: inherit;
  background: white;
  border: 1px solid var(--line);
  border-left: 5px solid var(--accent, #0f766e);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: 0 4px 6px -1px rgba(15,23,42,.06), 0 10px 25px -5px rgba(15,23,42,.08);
  transition: transform 200ms cubic-bezier(.4,0,.2,1), box-shadow 200ms cubic-bezier(.4,0,.2,1);
}
a.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 40px -8px rgba(15,23,42,.14);
}
.card .ic {
  font-size: 30px;
  width: 56px; height: 56px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent, #0f766e) 12%, white);
  border-radius: 14px;
}
.card .body { min-width: 0; }
.card .t { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
.card .d { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 0; }
.card .arrow { margin-left: auto; color: var(--muted); font-size: 22px; flex: none; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 48px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>house.luannguyen.work</h1>
      <p>Bộ công cụ xây nhà</p>
    </header>
    <div class="cards" id="cards"></div>
    <footer>Tĩnh hoàn toàn · lưu dữ liệu trên trình duyệt của bạn</footer>
  </div>
  <script src="/site.config.js"></script>
  <script>
    const cards = document.getElementById('cards');
    (window.PAGES || []).forEach(p => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = '/' + p.path;
      a.style.setProperty('--accent', p.accent || '#0f766e');
      a.innerHTML =
        '<div class="ic">' + (p.icon || '📄') + '</div>' +
        '<div class="body"><p class="t"></p><p class="d"></p></div>' +
        '<div class="arrow">→</div>';
      a.querySelector('.t').textContent = p.title;
      a.querySelector('.d').textContent = p.desc || '';
      cards.appendChild(a);
    });
  </script>
</body>
</html>
