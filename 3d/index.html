<!doctype html>
<meta charset="utf-8">
<title>Biệt thự 2 tầng — Mô hình 3D</title>
<style>
  :root{
    --ink:#1d2433; --paper:#f4efe6; --gold:#b8860b; --blue:#2f4a8c;
    --panel:rgba(20,26,40,.82);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1018;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:#eee}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* --- HUD --- */
  #hud{position:fixed;top:18px;left:18px;z-index:10;width:268px;
    background:var(--panel);backdrop-filter:blur(8px);
    border:1px solid rgba(184,134,11,.45);border-radius:14px;
    padding:16px 16px 12px;box-shadow:0 18px 50px rgba(0,0,0,.55);
    transition:transform .28s cubic-bezier(.22,.61,.36,1),opacity .28s}
  #hud h1{font-size:16px;margin:0 0 2px;letter-spacing:.5px;color:#f6e7c3}
  #hud .sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:#b8860b;margin-bottom:12px;font-family:Georgia,serif}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  button{flex:1 1 auto;min-width:0;cursor:pointer;font:inherit;font-size:12px;
    padding:8px 6px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);color:#ece5d6;transition:.15s}
  button:hover{background:rgba(184,134,11,.22);border-color:var(--gold)}
  button.on{background:linear-gradient(180deg,#caa14a,#9a7321);color:#1a1206;
    border-color:#e9cd86;font-weight:700}
  .hint{font-size:11px;line-height:1.5;color:#9aa3b5;margin-top:6px;
    font-family:Georgia,serif}
  .hint b{color:#cdb27a}
  #fps{position:fixed;bottom:12px;right:14px;z-index:10;font:11px Georgia,serif;
    color:#5f6b82}

  /* --- Nút ẩn/hiện bảng điều khiển --- */
  #hudToggle{position:fixed;top:18px;left:18px;z-index:21;display:none;
    width:46px;height:46px;border-radius:12px;cursor:pointer;
    align-items:center;justify-content:center;font-size:20px;
    background:var(--panel);backdrop-filter:blur(8px);color:#f6e7c3;
    border:1px solid rgba(184,134,11,.45);box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #hud.collapsed{transform:translateX(-115%);opacity:0;pointer-events:none}

  /* --- Mobile / màn hình hẹp --- */
  @media (max-width:760px),(pointer:coarse){
    #hudToggle{display:flex}
    #hud{top:74px;left:12px;right:12px;width:auto;max-width:340px;
      max-height:72vh;overflow-y:auto;padding:14px 14px 10px}
    button{padding:11px 8px;font-size:13px}      /* chạm dễ hơn */
    #fps{display:none}
    #brand{top:14px;right:12px}
    .hint-desktop{display:none}
  }

  /* --- BRAND BAR (đồng bộ giữa các trang) --- */
  #brand{position:fixed;top:18px;right:18px;z-index:20;display:flex;align-items:center;gap:10px}
  #brand .home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;font-size:13px;font-weight:600;
    color:#dfe6f0;background:rgba(20,26,40,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 14px 8px 11px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.18s}
  #brand .home:hover{border-color:#2dd4bf;color:#fff;background:rgba(15,118,110,.35)}
  #brand .home .ar{font-size:15px;line-height:1}
  #brand .logo{display:inline-flex;align-items:center;gap:6px;
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;font-size:13px;font-weight:700;
    letter-spacing:-.01em;color:#9aa3b5;padding-right:2px}
  #brand .logo .dot{width:7px;height:7px;border-radius:50%;background:#2dd4bf;
    box-shadow:0 0 0 3px rgba(45,212,191,.22)}
  @media (max-width:560px){#brand .logo{display:none}}
  #title{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;
    font:13px Georgia,serif;letter-spacing:3px;color:#cdb27a;text-transform:uppercase;
    pointer-events:none;text-shadow:0 2px 8px #000}
</style>

<div id="app"></div>

<button id="hudToggle" title="Ẩn/hiện bảng điều khiển" aria-label="Ẩn/hiện bảng điều khiển">☰</button>

<div id="brand">
  <a class="home" href="../" title="Về trang chủ"><span class="ar">←</span> Trang chủ</a>
  <span class="logo"><span class="dot"></span>house</span>
</div>

<div id="hud">
  <h1>Biệt Thự 2 Tầng</h1>
  <div class="sub">14 × 8 m · Tân cổ điển</div>
  <div class="row">
    <button id="bRoof" class="on">Mái</button>
    <button id="bWalls" class="on">Tường nhà</button>
    <button id="bFence" class="on">Tường rào</button>
    <button id="bLabels" class="on">Phòng</button>
  </div>
  <div class="row">
    <button id="bNight" class="on">Đèn đêm</button>
    <button id="bSpin">Tự xoay</button>
    <button id="bReset">Góc nhìn</button>
  </div>
  <div class="hint">
    <b>1 ngón</b> xoay · <b>2 ngón</b> chụm để zoom · <b>2 ngón kéo</b> di chuyển.<br>
    <span class="hint-desktop"><b>Kéo trái</b> xoay · <b>Lăn chuột</b> zoom · <b>Kéo phải</b> di chuyển.<br></span>
    Tắt <b>Mái</b> + <b>Tường nhà</b> để xem mặt bằng bên trong.
  </div>
</div>

<div id="fps"></div>
<div id="title">Mặt bằng nội thất — Tầng 1 &amp; 2</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   BIỆT THỰ 2 TẦNG — dựng từ floorplan + phối cảnh
   Đơn vị: mét.  Footprint 14 (X) × 8 (Z), 2 tầng cao 3.3m.
   Mặt tiền (có ban công + sảnh) quay về +Z.
   ============================================================ */
const W = 14, D = 8, FH = 3.3, WT = 0.22;      // rộng, sâu, cao tầng, dày tường
const F1 = 0.25, F2 = F1 + FH;                  // cao nền tầng 1 / tầng 2
const ROOFY = F2 + FH;                          // cao đỉnh tường
const FRONT = D/2;                              // mặt tiền tại z = +4

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x141c2e, 40, 120);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------- Bầu trời gradient hoàng hôn ---------- */
(function sky(){
  const c=document.createElement('canvas');c.width=2;c.height=256;
  const g=c.getContext('2d').createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#16223f');g.addColorStop(.45,'#3a4f7a');
  g.addColorStop(.75,'#9d7d6a');g.addColorStop(1,'#e7c79a');
  const ctx=c.getContext('2d');ctx.fillStyle=g;ctx.fillRect(0,0,2,256);
  const t=new THREE.CanvasTexture(c);
  const geo=new THREE.SphereGeometry(220,32,16);
  scene.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false})));
})();

/* ---------- Ánh sáng ---------- */
const hemi = new THREE.HemisphereLight(0xbcd0ff, 0x5a4a3a, .55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe6c0, 1.05);
sun.position.set(-22, 30, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const s=sun.shadow.camera; s.left=-28;s.right=28;s.top=28;s.bottom=-28;s.near=1;s.far=120;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8090c0,.35); fill.position.set(20,10,-20); scene.add(fill);

/* warm interior + sconce lights (đèn đêm) */
const nightLights = [];
function warmLight(x,y,z,inten,dist){
  const l=new THREE.PointLight(0xffb55c,inten,dist,2);
  l.position.set(x,y,z); scene.add(l); nightLights.push(l); return l;
}

/* ---------- Vật liệu ---------- */
const M = {
  wall  : new THREE.MeshStandardMaterial({color:0xefe7d6, roughness:.92}),
  wallIn: new THREE.MeshStandardMaterial({color:0xe9e2d2, roughness:.95, side:THREE.DoubleSide}),
  trim  : new THREE.MeshStandardMaterial({color:0xfbf7ee, roughness:.7}),
  roof  : new THREE.MeshStandardMaterial({color:0x2f4a8c, roughness:.45, metalness:.15, side:THREE.DoubleSide}),
  ridge : new THREE.MeshStandardMaterial({color:0xd9dde6, roughness:.5}),
  wood  : new THREE.MeshStandardMaterial({color:0x6b431f, roughness:.5, metalness:.1}),
  woodLt: new THREE.MeshStandardMaterial({color:0x8a5a2c, roughness:.55}),
  iron  : new THREE.MeshStandardMaterial({color:0x2a2620, roughness:.4, metalness:.6}),
  glass : new THREE.MeshStandardMaterial({color:0x20242b, roughness:.15, metalness:.2,
            transparent:true, opacity:.55, emissive:0x3a2a12, emissiveIntensity:1.1}),
  floor : new THREE.MeshStandardMaterial({color:0xd8cdb6, roughness:.7}),
  floor2: new THREE.MeshStandardMaterial({color:0xc9b89a, roughness:.7}),
  stair : new THREE.MeshStandardMaterial({color:0xb9a07a, roughness:.7}),
  stone : new THREE.MeshStandardMaterial({color:0x9a958c, roughness:.9}),
  gold  : new THREE.MeshStandardMaterial({color:0xc9a23a, roughness:.35, metalness:.9}),
  leaf  : new THREE.MeshStandardMaterial({color:0x3c5a32, roughness:1}),
  lamp  : new THREE.MeshStandardMaterial({color:0xffe2a8, emissive:0xff9a3a, emissiveIntensity:2.2, roughness:.4}),
};

/* ---------- Tiện ích dựng khối ---------- */
function box(w,h,d,mat,x,y,z,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  (parent||scene).add(m); return m;
}
// tường chạy dọc trục X tại z cố định, có thể khoét ô cửa (cùng sill/head)
function wallX(z, x0, x1, baseY, topY, openings, mat, group){
  const L=x1-x0, cx=(x0+x1)/2, th=WT;
  if(!openings||!openings.length){ box(L,topY-baseY,th,mat,cx,(baseY+topY)/2,z,group); return; }
  const o=openings.slice().sort((a,b)=>a.x0-b.x0);
  const sill=o[0].sill, head=o[0].head;
  box(L,sill-baseY,th,mat,cx,(baseY+sill)/2,z,group);       // dải dưới
  box(L,topY-head,th,mat,cx,(head+topY)/2,z,group);         // dải trên
  let cur=x0;
  for(const w of o){ if(w.x0>cur) box(w.x0-cur,head-sill,th,mat,(cur+w.x0)/2,(sill+head)/2,z,group); cur=w.x1; }
  if(cur<x1) box(x1-cur,head-sill,th,mat,(cur+x1)/2,(sill+head)/2,z,group);
}
// tường chạy dọc trục Z tại x cố định
function wallZ(x, z0, z1, baseY, topY, openings, mat, group){
  const L=z1-z0, cz=(z0+z1)/2, th=WT;
  if(!openings||!openings.length){ box(th,topY-baseY,L,mat,x,(baseY+topY)/2,cz,group); return; }
  const o=openings.slice().sort((a,b)=>a.z0-b.z0);
  const sill=o[0].sill, head=o[0].head;
  box(th,sill-baseY,L,mat,x,(baseY+sill)/2,cz,group);
  box(th,topY-head,L,mat,x,(head+topY)/2,cz,group);
  let cur=z0;
  for(const w of o){ if(w.z0>cur) box(th,head-sill,w.z0-cur,mat,x,(sill+head)/2,(cur+w.z0)/2,group); cur=w.z1; }
  if(cur<z1) box(th,head-sill,z1-cur,mat,x,(sill+head)/2,(cur+z1)/2,group);
}

/* ---------- Cửa sổ tân cổ điển CHI TIẾT (dựng theo hướng +Z rồi xoay) ---------- */
function windowUnit(x,y,z,w,h,facing,group){
  const g=new THREE.Group(); g.position.set(x,y,z);
  if(facing==='z-')g.rotation.y=Math.PI;
  else if(facing==='x+')g.rotation.y=Math.PI/2;
  else if(facing==='x-')g.rotation.y=-Math.PI/2;
  (group||scene).add(g);
  const hw=w/2, hh=h/2, o=0.05, fw=0.12;
  // --- kính + khung tối + đố chia ô ---
  box(w,h,0.05,M.iron,0,0,o-0.03,g);
  box(w-0.1,h-0.1,0.04,M.glass,0,0,o-0.005,g);
  box(0.05,h-0.08,0.07,M.iron,0,0,o,g);            // đố đứng giữa
  box(w-0.08,0.05,0.07,M.iron,0,h*0.12,o,g);       // đố ngang trên
  box(w-0.08,0.05,0.07,M.iron,0,-h*0.16,o,g);      // đố ngang dưới
  // --- phào bao 2 lớp (architrave) ---
  box(w+fw*2,fw,0.13,M.trim,0,hh+fw/2,o,g);
  box(fw,h+fw*2,0.13,M.trim,-hw-fw/2,0,o,g);
  box(fw,h+fw*2,0.13,M.trim, hw+fw/2,0,o,g);
  box(w+fw*2+0.12,0.06,0.17,M.trim,0,hh+fw+0.05,o+0.01,g);  // gờ ngoài trên
  box(0.07,h+fw*2,0.17,M.trim,-hw-fw-0.06,0,o+0.01,g);
  box(0.07,h+fw*2,0.17,M.trim, hw+fw+0.06,0,o+0.01,g);
  // --- bệ cửa sổ + 2 console đỡ ---
  box(w+0.34,0.1,0.24,M.trim,0,-hh-0.06,o+0.06,g);
  box(0.12,0.24,0.2,M.trim,-hw+0.08,-hh-0.22,o+0.05,g);
  box(0.12,0.24,0.2,M.trim, hw-0.08,-hh-0.22,o+0.05,g);
  // --- mũ cửa: lintel phẳng đua ra + vỉ cuộn nhỏ 2 góc trên ---
  box(w+0.5,0.16,0.3,M.trim,0,hh+fw+0.13,o+0.07,g);
  box(w+0.64,0.07,0.34,M.trim,0,hh+fw+0.24,o+0.08,g);
  [-1,1].forEach(s=>{const sc=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.035,6,12),M.trim);
    sc.rotation.y=Math.PI/2; sc.position.set(s*(hw+0.05),hh+0.04,o+0.1); g.add(sc);});
}

/* ---------- Cột / phào trụ (pilaster) Ionic có rãnh ---------- */
function pilaster(x,z,baseY,h,w){
  const g=new THREE.Group(); g.position.set(x,baseY,z); scene.add(g);
  const shaftH=h-0.7;
  box(w,shaftH,w,M.trim,0,0.36+shaftH/2,0,g);                 // thân cột
  for(let i=-2;i<=2;i++) box(0.03,shaftH*0.9,0.025,M.wall,i*w*0.18,0.36+shaftH/2,w/2+0.006,g); // rãnh dọc
  box(w*1.4,0.16,w*1.4,M.trim,0,0.08,0,g);                    // chân
  box(w*1.22,0.12,w*1.22,M.trim,0,0.22,0,g);
  box(w*1.05,0.08,w*1.05,M.trim,0,0.36+shaftH+0.04,0,g);      // cổ cột
  box(w*1.55,0.16,w*0.55,M.trim,0,h-0.16,w*0.18,g);           // abacus đầu cột
  [-1,1].forEach(s=>{const v=new THREE.Mesh(new THREE.TorusGeometry(w*0.26,0.045,8,16),M.trim);
    v.position.set(s*w*0.46,h-0.32,w*0.42);v.rotation.x=Math.PI/2;v.castShadow=true;g.add(v);}); // xoắn ốc volute
}
/* ---------- Đầu hồi tam giác (pediment) ---------- */
function pedimentTri(cx,cy,cz,halfW,rise,group){
  const len=Math.hypot(halfW,rise), ang=Math.atan2(rise,halfW);
  const l=box(len,0.11,0.18,M.trim,cx-halfW/2,cy+rise/2,cz,group); l.rotation.z=ang;
  const r=box(len,0.11,0.18,M.trim,cx+halfW/2,cy+rise/2,cz,group); r.rotation.z=-ang;
}
/* ---------- Console / corbel (đỡ) có xoắn ---------- */
function corbel(x,y,z,group){
  const g=new THREE.Group(); g.position.set(x,y,z); (group||scene).add(g);
  box(0.18,0.42,0.3,M.trim,0,0,0,g);
  const s=new THREE.Mesh(new THREE.TorusGeometry(0.11,0.045,6,14),M.trim);
  s.rotation.y=Math.PI/2; s.position.set(0,-0.18,0.13); g.add(s);
  box(0.24,0.1,0.34,M.trim,0,0.21,0.02,g);
}
/* ---------- Đèn lồng tường (sconce) ---------- */
function sconce(x,y,z,withLight){
  const g=new THREE.Group(); g.position.set(x,y,z); scene.add(g);
  box(0.09,0.36,0.05,M.iron,0,0,0.02,g);
  box(0.05,0.05,0.16,M.iron,0,0.18,0.1,g);
  box(0.05,0.05,0.16,M.iron,0,-0.06,0.1,g);
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,0.26,6),M.lamp);
  lamp.position.set(0,0.06,0.18); g.add(lamp);
  box(0.14,0.04,0.14,M.iron,0,0.22,0.18,g);
  if(withLight) warmLight(x,y+0.1,z+0.45,0.9,5);
}
/* ---------- Lục bình / chậu cây trang trí ---------- */
function urn(x,z){
  const g=new THREE.Group(); g.position.set(x,F1+0.45,z); scene.add(g);
  const a=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.28,0.5,12),M.trim);a.position.y=0.25;a.castShadow=true;g.add(a);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.16,0.32,12),M.trim);b.position.y=0.6;g.add(b);
  const p=new THREE.Mesh(new THREE.SphereGeometry(0.32,8,6),M.leaf);p.position.y=0.85;p.castShadow=true;g.add(p);
}
/* ---------- Hoa văn hình quạt (shell) ---------- */
function fanShell(x,y,z,r){
  const g=new THREE.Group(); g.position.set(x,y,z); scene.add(g);
  for(let i=0;i<=12;i++){const a=Math.PI*i/12;
    const rib=box(0.035,r,0.05,M.trim,Math.cos(a)*r*0.5,Math.sin(a)*r*0.5,0.04,g);rib.rotation.z=a-Math.PI/2;}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.06,12),M.trim);hub.rotation.x=Math.PI/2;hub.position.z=0.05;g.add(hub);
}
/* ---------- Cửa gỗ 2 cánh chạm mặt trời ---------- */
function carvedDoor(x,baseY,z,group){
  const g=new THREE.Group(); g.position.set(x,baseY,z); (group||scene).add(g);
  box(2.18,0.16,0.16,M.trim,0,2.58,0.04,g);                 // lanh tô
  [-0.95,0.95].forEach(s=>box(0.16,2.55,0.16,M.trim,s,1.28,0.04,g)); // chỉ đứng
  box(2.0,2.5,0.12,M.wood,0,1.27,0,g);                      // khung gỗ
  [-0.5,0.5].forEach(s=>{
    box(0.88,2.34,0.08,M.woodLt,s,1.28,0.05,g);
    box(0.66,0.95,0.04,M.wood,s,1.78,0.1,g);                // ô trên
    box(0.66,0.7 ,0.04,M.wood,s,0.72,0.1,g);                // ô dưới
  });
  const sb=new THREE.Group(); sb.position.set(0,1.28,0.12); g.add(sb);  // mặt trời
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.05,16),M.gold);disc.rotation.x=Math.PI/2;sb.add(disc);
  for(let i=0;i<12;i++){const a=i*Math.PI/6;const ray=box(0.03,0.17,0.03,M.gold,Math.cos(a)*0.3,Math.sin(a)*0.3,0,sb);ray.rotation.z=a;}
  [-0.18,0.18].forEach(s=>box(0.05,0.16,0.06,M.gold,s,1.05,0.13,g)); // tay nắm
}
/* ---------- Phào diềm mái (cornice + dentil) quanh nhà ---------- */
function corniceRunX(y,z,x0,x1,front){
  const L=x1-x0,cx=(x0+x1)/2,d=front?1:-1;
  box(L,0.3,0.22,M.trim,cx,y,z,scene);
  box(L+0.1,0.1,0.36,M.trim,cx,y+0.2,z+0.07*d,scene);
  box(L,0.08,0.14,M.trim,cx,y-0.18,z+0.04*d,scene);

const roof = new THREE.Group(); scene.add(roof);
function hipRoof(cx,cz,wx,dz,y0,rh,ov,mat,group){
  const o = typeof ov === 'object' ? ov : {n:ov,s:ov,e:ov,w:ov};
  const xL=-wx/2-o.w, xR=wx/2+o.e, zB=-dz/2-o.n, zF=dz/2+o.s;
  const wE=xR-xL, dE=zF-zB;
  const rX=(xL+xR)/2, rZ=(zF+zB)/2;
  const rl=Math.max(0,(wE-dE)/2);
  const v=[
    [xL,0,zB],[xR,0,zB],[xR,0,zF],[xL,0,zF],         // 4 mép hiên (có thể bất đối xứng)
    [rX-rl,rh,rZ],[rX+rl,rh,rZ]                       // 2 điểm nóc (lệch theo ov)
  ];
  const f=[[0,1,5],[0,5,4],[2,3,4],[2,4,5],[3,0,4],[1,2,5]];
  const pos=[];
  f.forEach(t=>t.forEach(i=>pos.push(v[i][0]+cx,v[i][1]+y0,v[i][2]+cz)));
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat); m.castShadow=true; group.add(m);
  // nóc + diềm
  box(rl*2+0.2,0.12,0.5,M.ridge,cx+rX,y0+rh,cz+rZ,group);
  box(wE+0.1,0.18,0.18,M.trim,cx+rX,y0+0.02,cz+zF,group);
  box(wE+0.1,0.18,0.18,M.trim,cx+rX,y0+0.02,cz+zB,group);
  return m;
}

/* ===========================================================
   TƯỜNG RÀO + CỔNG (tân cổ điển) — toggle bật/tắt
   - Đông cách tường nhà 3.5m theo note (pE = W/2 + 3.5)
   - Cổng đặt trên tường đông, có 2 trụ + 2 cánh sắt mỹ thuật
   =========================================================== */
const fence = new THREE.Group(); scene.add(fence);
(function buildFence(){
  const pE=10.5, pW=-12, pS=15, pN=-5;          // ranh giới khu đất (sau cách nhà 1m)
  const wH=1.4, wT=0.22;                        // chiều cao / dày tường rào
  const GZ=5.5, GW=4.0;                         // tâm cổng (ngang mặt tiền) & độ rộng

  function wallRunX(z, x0, x1){
    const L=x1-x0, cx=(x0+x1)/2;
    box(L, wH, wT, M.wall, cx, wH/2, z, fence);
    box(L+0.06, 0.12, wT+0.1, M.trim, cx, wH+0.06, z, fence);              // mũ tường
    box(L-0.4, wH*0.55, 0.04, M.wallIn, cx, wH*0.5,
        z+(z>0?-wT/2-0.02:wT/2+0.02), fence);                              // panel chìm
  }
  function wallRunZ(x, z0, z1){
    const L=z1-z0, cz=(z0+z1)/2;
    box(wT, wH, L, M.wall, x, wH/2, cz, fence);
    box(wT+0.1, 0.12, L+0.06, M.trim, x, wH+0.06, cz, fence);
    box(0.04, wH*0.55, L-0.4, M.wallIn,
        x+(x>0?-wT/2-0.02:wT/2+0.02), wH*0.5, cz, fence);
  }
  wallRunX(pN, pW, pE);  wallRunX(pS, pW, pE);
  wallRunZ(pW, pN, pS);
  wallRunZ(pE, pN, GZ-GW/2);  wallRunZ(pE, GZ+GW/2, pS);

  /* trụ phân đoạn dọc tường */
  function post(x,z,big){
    const h=big?wH+0.55:wH+0.28, w=big?0.5:0.32;
    box(w,h,w,M.trim,x,h/2,z,fence);
    box(w+0.14,0.14,w+0.14,M.trim,x,h-0.07,z,fence);
    if(big){const b=new THREE.Mesh(new THREE.SphereGeometry(0.17,12,8),M.trim);
      b.position.set(x,h+0.13,z); fence.add(b);}
  }
  post(pW,pN,true); post(pE,pN,true); post(pW,pS,true); post(pE,pS,true);
  for(let x=pW+2.6;x<pE-1;x+=2.8){ post(x,pN,false); post(x,pS,false); }
  for(let z=pN+2.6;z<pS-1;z+=2.8){
    post(pW,z,false);
    if(z<GZ-GW/2-0.4 || z>GZ+GW/2+0.4) post(pE,z,false);
  }

  /* ---------- 2 TRỤ CỔNG (rãnh dọc + chóp cầu + cone) ---------- */
  const piH=2.9, piW=0.72;
  [GZ-GW/2, GZ+GW/2].forEach(gz=>{
    const g=new THREE.Group(); g.position.set(pE,0,gz); fence.add(g);
    box(piW*1.4,0.25,piW*1.4,M.stone,0,0.125,0,g);                         // bệ đá
    box(piW*1.2,0.12,piW*1.2,M.trim, 0,0.31,0,g);                          // gờ chân
    const sH=piH-0.85;
    box(piW,sH,piW,M.trim,0,0.4+sH/2,0,g);                                 // thân
    for(let i=-1;i<=1;i++){
      box(0.03,sH*0.9,0.025,M.wall,i*piW*0.3,0.4+sH/2, piW/2+0.005,g);
      box(0.03,sH*0.9,0.025,M.wall,i*piW*0.3,0.4+sH/2,-piW/2-0.005,g);
      box(0.025,sH*0.9,0.03,M.wall, piW/2+0.005,0.4+sH/2,i*piW*0.3,g);
      box(0.025,sH*0.9,0.03,M.wall,-piW/2-0.005,0.4+sH/2,i*piW*0.3,g);
    }
    box(piW*1.15,0.1,piW*1.15,M.trim,0,piH-0.45,0,g);                      // cổ
    box(piW*1.5,0.22,piW*1.5,M.trim,0,piH-0.2,0,g);                        // mũ cột
    box(piW*1.3,0.1,piW*1.3,M.trim, 0,piH-0.04,0,g);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(0.2,16,12),M.trim);
    ball.position.set(0,piH+0.16,0); g.add(ball);
    const sp=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.5,8),M.trim);
    sp.position.set(0,piH+0.5,0); g.add(sp);
    // panel chạm chìm trên thân (2 mặt ngoài)
    box(piW*0.55,sH*0.55,0.03,M.wallIn,0,0.4+sH/2, piW/2+0.012,g);
    box(piW*0.55,sH*0.55,0.03,M.wallIn,0,0.4+sH/2,-piW/2-0.012,g);
    // đèn nhỏ phía trong (hướng vào sân)
    const lamp=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.22,0.16),M.lamp);
    lamp.position.set(-piW/2-0.13, piH-0.05, 0); g.add(lamp);
    warmLight(pE-piW/2-0.35, piH-0.0, gz, 0.7, 6);
  });

  /* ---------- 2 CÁNH CỔNG sắt mỹ thuật ---------- */
  const ghH=1.95, leafZ=GW/2-0.08;
  [-1,1].forEach(s=>{
    const cz=GZ+s*GW/4;
    const lg=new THREE.Group(); lg.position.set(pE,0,cz); fence.add(lg);
    box(0.06,0.08,leafZ,M.iron,0,ghH-0.04,0,lg);                            // ray trên
    box(0.06,0.08,leafZ,M.iron,0,0.04,0,lg);                                // ray dưới
    box(0.06,ghH,0.08,M.iron,0,ghH/2,-leafZ/2+0.04,lg);                     // cạnh đứng trái
    box(0.06,ghH,0.08,M.iron,0,ghH/2, leafZ/2-0.04,lg);                     // cạnh đứng phải
    for(let z=-leafZ/2+0.18;z<leafZ/2-0.1;z+=0.13){                         // các thanh đứng
      box(0.04,ghH-0.16,0.04,M.iron,0,ghH/2,z,lg);
    }
    box(0.06,0.05,leafZ-0.06,M.gold,0,ghH*0.58,0,lg);                       // dải vàng
    box(0.06,0.05,leafZ-0.06,M.gold,0,ghH*0.42,0,lg);
    for(let z=-leafZ/2+0.35;z<leafZ/2-0.25;z+=0.4){                         // vòng hoa văn
      const rg=new THREE.Mesh(new THREE.TorusGeometry(0.085,0.018,6,12),M.gold);
      rg.rotation.y=Math.PI/2; rg.position.set(0,ghH*0.5,z); lg.add(rg);
    }
    for(let z=-leafZ/2+0.18;z<leafZ/2-0.1;z+=0.13){                         // chóp nhọn vàng
      const tip=new THREE.Mesh(new THREE.ConeGeometry(0.025,0.08,6),M.gold);
      tip.position.set(0,ghH-0.03,z); lg.add(tip);
    }
  });

  /* đường đá lát từ cổng vào sân */
  box(GW+0.4, 0.04, 3.2, M.stone, pE-1.7, 0.02, GZ, fence);
})();

/* ===========================================================
   6. NHÃN TÊN PHÒNG (sprite)
   =========================================================== */
const labels = new THREE.Group(); scene.add(labels);
function label(text,x,y,z){
  const c=document.createElement('canvas');c.width=256;c.height=64;
  const x2=c.getContext('2d');
  x2.fillStyle='rgba(20,15,8,.78)';x2.fillRect(0,0,256,64);
  x2.strokeStyle='#caa14a';x2.lineWidth=3;x2.strokeRect(2,2,252,60);
  x2.fillStyle='#f6e7c3';x2.font='bold 30px Georgia';x2.textAlign='center';
  x2.textBaseline='middle';x2.fillText(text,128,34);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),
    depthTest:false,transparent:true}));
  s.position.set(x,y,z);s.scale.set(2.4,0.6,1);labels.add(s);
}
label('P.NGỦ 1',4.4,F1+2.6,2.4); label('P.NGỦ 2',-3.6,F1+2.6,2.4);
label('P.KHÁCH',4,F1+2.6,-2.6);  label('BẾP+ĂN',-3.6,F1+2.6,-2.6);
label('SẢNH',0,F1+0.8,BAYZ+1.5);
label('P.NGỦ 3',-3.6,F2+2.6,-2.0);label('P.NGỦ 4',-3.6,F2+2.6,2.4);
label('P.THỜ',4.3,F2+2.6,2.3);   label('SHC',4,F2+2.6,-2.6);
label('BAN CÔNG',0,F2+0.6,BAYZ+0.8);

/* ===========================================================
   7. CAMERA CONTROLS (tự viết — không cần OrbitControls)
   =========================================================== */
const target=new THREE.Vector3(0,F1+2,0);
const RADIUS_MIN=6, RADIUS_MAX=120;            // cho phép lùi xa hơn để thấy tổng thể
const DEFAULT_VIEW={radius:30, theta:0.9, phi:1.15};
let radius=30, theta=0.9, phi=1.15, autoSpin=false;
function clampR(v){ return Math.max(RADIUS_MIN,Math.min(RADIUS_MAX,v)); }
function applyCam(){
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}

// FOV + góc nhìn mặc định thích ứng theo tỉ lệ màn hình.
// Màn dọc (mobile) hẹp ngang -> FOV rộng hơn + lùi xa hơn để nhà 14m vừa khung.
function fitView(){
  const ar=innerWidth/innerHeight;
  camera.fov = ar<1 ? 60 : 48;                 // portrait: 60°, landscape/desktop: 48°
  camera.updateProjectionMatrix();
  DEFAULT_VIEW.radius = ar<0.7 ? 46 : ar<1 ? 38 : 30;  // càng hẹp càng lùi xa
}
function resetView(){ radius=DEFAULT_VIEW.radius; theta=DEFAULT_VIEW.theta; phi=DEFAULT_VIEW.phi; target.set(0,F1+2,0); }

const dom=renderer.domElement; let drag=null,px=0,py=0;
dom.addEventListener('contextmenu',e=>e.preventDefault());

/* --- Chuột (desktop) --- */
dom.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch')return; drag=e.button;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',e=>{ if(e.pointerType==='touch')return; drag=null;});
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||drag===null)return;
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  if(drag===0){ theta-=dx*0.005; phi=Math.max(0.15,Math.min(1.52,phi-dy*0.005)); }
  else{ panBy(dx,dy); }
});
dom.addEventListener('wheel',e=>{e.preventDefault();radius=clampR(radius+e.deltaY*0.03);},{passive:false});

function panBy(dx,dy){
  const r=new THREE.Vector3().crossVectors(camera.up,camera.getWorldDirection(new THREE.Vector3())).normalize();
  target.addScaledVector(r,dx*radius*0.0016);
  target.y=Math.max(0,target.y+dy*radius*0.0016);
}

/* --- Cảm ứng (mobile): 1 ngón xoay · 2 ngón chụm zoom + kéo pan --- */
let touches={}, lastDist=0, lastMidX=0, lastMidY=0;
function tList(e){ return Array.from(e.touches); }
dom.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=tList(e);
  if(t.length===1){ px=t[0].clientX; py=t[0].clientY; }
  else if(t.length===2){
    lastDist=Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    lastMidX=(t[0].clientX+t[1].clientX)/2; lastMidY=(t[0].clientY+t[1].clientY)/2;
  }
},{passive:false});
dom.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=tList(e);
  if(t.length===1){
    const dx=t[0].clientX-px, dy=t[0].clientY-py; px=t[0].clientX; py=t[0].clientY;
    theta-=dx*0.005; phi=Math.max(0.15,Math.min(1.52,phi-dy*0.005));
  } else if(t.length===2){
    const dist=Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    const midX=(t[0].clientX+t[1].clientX)/2, midY=(t[0].clientY+t[1].clientY)/2;
    if(lastDist>0) radius=clampR(radius*(lastDist/dist));   // chụm/giãn = zoom
    panBy(midX-lastMidX, midY-lastMidY);                    // hai ngón kéo = di chuyển
    lastDist=dist; lastMidX=midX; lastMidY=midY;
  }
},{passive:false});
dom.addEventListener('touchend',e=>{
  if(e.touches.length<2) lastDist=0;
  if(e.touches.length===1){ px=e.touches[0].clientX; py=e.touches[0].clientY; }
},{passive:false});

/* --- Nút ẩn/hiện bảng điều khiển --- */
document.getElementById('hudToggle').onclick=()=>{
  document.getElementById('hud').classList.toggle('collapsed');
};

tog('bRoof', v=>roof.visible=v);

  M.glass.emissiveIntensity=v?1.1:0.15;
  sun.intensity=v?1.0:1.12; hemi.intensity=v?.55:.62;
  renderer.toneMappingExposure=v?1.06:0.96;});
document.getElementById('bSpin').onclick=function(){autoSpin=!autoSpin;this.classList.toggle('on',autoSpin);};
document.getElementById('bReset').onclick=()=>{fitView();resetView();};

/* ===========================================================
   9. LOOP
   =========================================================== */
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
  fitView();renderer.setSize(innerWidth,innerHeight);});
let last=performance.now(),frames=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(autoSpin)theta+=0.0025;
  applyCam();
  renderer.render(scene,camera);
  frames++;acc+=t-last;last=t;
  if(acc>500){document.getElementById('fps').textContent=Math.round(1000*frames/acc)+' fps';frames=0;acc=0;}
}
fitView();resetView();applyCam();loop(performance.now());
</script>
